<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工作流看板</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f6f8;
  --panel: #ffffff;
  --panel-2: #f7f8fa;
  --line: #e2e6eb;
  --line-strong: #cbd2dc;
  --text: #1f2937;
  --muted: #6b7280;
  --brand: #4f7cff;
  --ok: #16a34a;
  --warn: #d97706;
  --bad: #dc2626;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05);
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #111418;
    --panel: #191d23;
    --panel-2: #20252c;
    --line: #2a313a;
    --line-strong: #3a434f;
    --text: #e6eaf0;
    --muted: #99a2af;
    --shadow: 0 1px 2px rgba(0, 0, 0, .28);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--text); font: 13px/1.5 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
button { font: inherit; }
button { cursor: pointer; }
.top { position: sticky; top: 0; z-index: 20; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--panel) 94%, transparent); backdrop-filter: blur(10px); }
.top-inner { max-width: 1280px; margin: 0 auto; padding: 12px 18px; display: flex; align-items: center; gap: 14px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mark { width: 30px; height: 30px; flex: none; display: inline-flex; align-items: center; justify-content: center; border-radius: 9px; background: color-mix(in srgb, var(--brand) 13%, transparent); color: var(--brand); font-size: 15px; font-weight: 700; }
.brand h1 { margin: 0; font-size: 15px; line-height: 1.3; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand p { margin: 1px 0 0; color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.status { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); font-size: 11px; white-space: nowrap; }
.status.waiting { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 38%, var(--line)); background: color-mix(in srgb, var(--warn) 8%, var(--panel)); }
.status.running { color: var(--brand); border-color: color-mix(in srgb, var(--brand) 38%, var(--line)); background: color-mix(in srgb, var(--brand) 8%, var(--panel)); }
.status.done { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 38%, var(--line)); background: color-mix(in srgb, var(--ok) 8%, var(--panel)); }
.status.failed { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 38%, var(--line)); background: color-mix(in srgb, var(--bad) 8%, var(--panel)); }
.perm { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; color: var(--muted); background: var(--panel-2); border: 1px solid var(--line); font-size: 10.5px; white-space: nowrap; }
.perm.on { color: var(--text); border-color: color-mix(in srgb, var(--ok) 30%, var(--line)); }
.btn { border: 1px solid var(--line); border-radius: 7px; background: var(--panel); color: var(--text); padding: 6px 11px; font-size: 12px; white-space: nowrap; transition: background .12s ease, border-color .12s ease; }
.btn:hover { background: var(--panel-2); border-color: var(--line-strong); }
.btn.primary { background: var(--brand); border-color: transparent; color: #fff; }
.btn.primary:hover { background: color-mix(in srgb, var(--brand) 88%, #000); }
.btn.ghost { background: transparent; }
.btn[disabled] { opacity: .45; cursor: default; }
.icon-btn { width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-size: 18px; line-height: 1; }
.icon-btn:hover { background: var(--panel-2); color: var(--text); }
.page { max-width: 1280px; margin: 0 auto; padding: 16px 18px 40px; }
.top-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 14px; align-items: start; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.card-head { min-height: 40px; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.card-head strong { font-size: 12px; letter-spacing: .01em; }
.card-head .hint { color: var(--muted); font-size: 10.5px; }
.card-head .spacer { flex: 1; }
.legend { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 10px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 3px; vertical-align: 1px; }
.graph-card { min-width: 0; }
.graph { position: relative; height: clamp(520px, 66vh, 760px); overflow: hidden; cursor: grab; touch-action: none; user-select: none; background-image: radial-gradient(circle, color-mix(in srgb, var(--line) 76%, transparent) .8px, transparent 1px); background-size: 18px 18px; }
.graph.dragging { cursor: grabbing; }
.graph svg { position: absolute; left: 0; top: 0; transform-origin: 0 0; display: block; }
.graph-tools { position: absolute; right: 12px; top: 12px; z-index: 3; display: flex; align-items: center; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 8px; background: color-mix(in srgb, var(--panel) 94%, transparent); box-shadow: var(--shadow); backdrop-filter: blur(6px); }
.graph-tools button { min-width: 26px; height: 24px; padding: 0 6px; border: 0; border-radius: 5px; background: transparent; color: var(--text); font-size: 12px; }
.graph-tools button:hover { background: var(--panel-2); }
.graph-tools .zoom-label { min-width: 42px; text-align: center; color: var(--muted); font-size: 10.5px; font-variant-numeric: tabular-nums; }
.node { cursor: pointer; }
.node:hover .node-box { filter: drop-shadow(0 3px 8px rgba(16, 24, 40, .14)); }
.node-box { fill: var(--panel); stroke: var(--line); stroke-width: 1; filter: drop-shadow(0 1px 2px rgba(16, 24, 40, .06)); }
.node-box.wait { stroke: var(--warn); stroke-width: 2; }
.node-box.running { stroke: var(--brand); stroke-width: 2; }
.node-box.failed { stroke: var(--bad); stroke-width: 2; }
.node-box.done { stroke: color-mix(in srgb, var(--ok) 24%, var(--line)); }
.node-box.human { stroke-dasharray: 5 4; }
.node-box.selected { stroke: var(--brand); stroke-width: 2; }
.node-title { font-size: 13px; font-weight: 650; fill: var(--text); letter-spacing: -.005em; }
.node-meta { font-size: 10px; fill: var(--muted); }
.node-detail-text { font-size: 9.5px; fill: var(--muted); }
.node-status-label { font-size: 9px; fill: var(--muted); }
.node-glyph { font-size: 11px; font-weight: 700; fill: #fff; }
.node-count { font-size: 9px; fill: var(--muted); }
.edge-label { font-size: 8.5px; font-weight: 550; fill: var(--muted); }
.edge-pill { fill: var(--panel); stroke: var(--line); stroke-width: .6; }
.right-rail { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.run-card { min-width: 0; }
.run-summary { padding: 10px 12px 0; display: grid; gap: 4px; font-size: 11px; color: var(--muted); }
.run-summary strong { color: var(--text); font-weight: 600; }
.run-actions { padding: 10px 12px; display: flex; gap: 7px; flex-wrap: wrap; }
.control-row { display: flex; align-items: center; gap: 7px; padding: 9px 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; cursor: pointer; }
.control-row input { accent-color: var(--brand); }
.control-hint { margin-left: auto; color: var(--muted); font-size: 10px; }
.queue-card { min-width: 0; }
.queue-list { display: flex; flex-direction: column; }
.queue-item { padding: 8px 12px; border-top: 1px solid var(--line); font-size: 11px; }
.queue-item:first-child { border-top: 0; }
.queue-item-title { color: var(--text); font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.queue-item-meta { color: var(--muted); font-size: 10px; margin-top: 2px; display: flex; gap: 5px; flex-wrap: wrap; }
.queue-empty { padding: 12px; color: var(--muted); font-size: 11px; line-height: 1.6; }
.human-card { min-width: 0; }
.human-todo { display: flex; flex-direction: column; }
.human-count { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, var(--panel)); font-size: 10px; }
.human-item { padding: 11px 12px; border-top: 1px solid var(--line); }
.human-item:first-child { border-top: 0; }
.human-item-title { font-size: 12px; font-weight: 600; margin-bottom: 2px; }
.human-item-meta { color: var(--muted); font-size: 10.5px; margin-bottom: 7px; overflow-wrap: anywhere; }
.human-item-note { width: 100%; min-height: 52px; margin: 0 0 8px; resize: vertical; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); color: var(--text); padding: 6px 8px; font: 11px/1.5 -apple-system, "Segoe UI", "PingFang SC", sans-serif; }
.human-item-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.human-item-actions .btn { padding: 4px 9px; font-size: 11px; }
.human-item-actions .btn.reject { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 35%, var(--line)); }
.human-history { padding: 8px 12px 11px; border-top: 1px solid var(--line); }
.human-history-title { color: var(--muted); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 5px; }
.human-history-item { display: flex; align-items: center; gap: 6px; padding: 3px 0; color: var(--muted); font-size: 10.5px; }
.human-history-item strong { color: var(--text); font-weight: 550; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.human-history-item span { margin-left: auto; white-space: nowrap; }
.human-empty { padding: 14px 12px; color: var(--muted); font-size: 11px; line-height: 1.6; }
.muted-note { padding: 10px 12px; color: var(--muted); font-size: 11px; }
.detail-card { margin-top: 14px; }
.detail-card.hide { display: none; }
.detail-body { padding: 12px; display: grid; grid-template-columns: minmax(240px, 290px) minmax(0, 1fr); gap: 14px; align-items: start; }
.detail-side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.detail-main { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.detail-kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 5px 10px; font-size: 11px; align-content: start; }
.detail-kv dt { color: var(--muted); }
.detail-kv dd { margin: 0; overflow-wrap: anywhere; }
.detail-section { border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--panel); }
.detail-section-head { display: flex; align-items: center; gap: 8px; min-height: 30px; padding: 5px 9px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 10.5px; font-weight: 600; }
.detail-section-head .spacer { flex: 1; }
.detail-pre { margin: 0; max-height: 220px; overflow: auto; padding: 9px; background: var(--panel-2); font: 10px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
.detail-error { border-color: color-mix(in srgb, var(--bad) 35%, var(--line)); }
.detail-error .detail-section-head { color: var(--bad); }
.detail-links { display: flex; flex-direction: column; gap: 5px; }
.detail-links-title { color: var(--muted); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.node-chip { display: inline-flex; align-items: center; gap: 5px; max-width: 100%; padding: 3px 6px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel-2); color: var(--text); font-size: 10.5px; text-align: left; }
.node-chip:hover { border-color: var(--line-strong); background: var(--panel); }
.node-chip .edge-on { color: var(--muted); font-size: 9.5px; }
.detail-token-list { display: flex; flex-direction: column; max-height: 168px; overflow: auto; }
.detail-token { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px; padding: 5px 9px; border-top: 1px solid var(--line); font-size: 10.5px; }
.detail-token:first-child { border-top: 0; }
.detail-token .run-status { color: var(--muted); }
.detail-token .run-outcome { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.detail-token .run-time { color: var(--muted); font-variant-numeric: tabular-nums; }
.detail-token.active { background: color-mix(in srgb, var(--brand) 6%, transparent); }
.model-list { display: flex; flex-direction: column; }
.model-row { display: flex; align-items: center; gap: 6px; padding: 6px 9px; border-top: 1px solid var(--line); font-size: 10.5px; }
.model-row:first-child { border-top: 0; }
.model-index { width: 16px; color: var(--muted); font-variant-numeric: tabular-nums; }
.model-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.model-actions { display: flex; gap: 2px; }
.model-actions button { width: 20px; height: 20px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--muted); font-size: 10px; line-height: 1; }
.model-actions button:hover { color: var(--text); border-color: var(--line-strong); }
.model-add { display: flex; gap: 5px; flex-wrap: wrap; padding: 8px 9px; border-top: 1px solid var(--line); background: var(--panel-2); }
.model-add select { min-width: 0; height: 26px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); color: var(--text); font-size: 10.5px; padding: 0 5px; }
.model-add .btn { padding: 3px 8px; font-size: 10.5px; }
.model-help { padding: 7px 9px; color: var(--muted); font-size: 10px; line-height: 1.5; border-top: 1px solid var(--line); }
.model-empty { padding: 9px; color: var(--muted); font-size: 10.5px; }
.model-catalog { border-top: 1px solid var(--line); padding: 8px 9px; }
.model-catalog summary { color: var(--text); font-size: 11px; cursor: pointer; }
.model-catalog-items { max-height: 240px; overflow: auto; margin-top: 8px; }
.model-provider { margin-bottom: 8px; }
.model-provider > strong { display: block; color: var(--muted); font-size: 10.5px; margin-bottom: 4px; }
.model-choice { display: flex; gap: 7px; align-items: flex-start; padding: 5px 6px; border-radius: 5px; cursor: pointer; font-size: 11px; }
.model-choice:hover { background: var(--panel-2); }
.model-choice input { margin-top: 2px; accent-color: var(--brand); }
.model-choice small { display: block; color: var(--muted); font-size: 9px; }
.model-actions button:disabled { opacity: .35; cursor: default; }

.empty { padding: 44px 18px; text-align: center; color: var(--muted); }
.empty strong { display: block; margin-bottom: 5px; color: var(--text); font-size: 13px; }
.toast { position: fixed; right: 18px; bottom: 18px; z-index: 30; max-width: 440px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); box-shadow: var(--shadow); font-size: 11.5px; }
.toast.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 35%, var(--line)); }
@media (max-width: 1000px) {
  .top-grid { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 900px) {
  .graph { height: clamp(420px, 58vh, 620px); }
  .detail-body { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 620px) {
  .top-inner { align-items: flex-start; }
  .brand p { display: none; }
  .top-actions { gap: 5px; }
  .perm { display: none; }
  .page { padding: 10px 10px 28px; }
}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <span class="mark">⌘</span>
      <div><h1 id="name">工作流看板</h1><p id="sub">正在加载…</p></div>
    </div>
    <div class="top-actions">
      <span class="status" id="status">未运行</span>
      <span class="perm" id="permCommand">命令</span>
      <span class="perm" id="permHttp">HTTP</span>
      <button class="btn" id="refresh" type="button">刷新</button>
    </div>
  </div>
</header>

<main class="page">
  <div class="top-grid">
    <section class="card graph-card">
      <div class="card-head">
        <strong>节点图</strong>
        <span class="hint" id="graphHint"></span>
        <span class="spacer"></span>
        <div class="legend" id="legend"></div>
      </div>
      <div class="graph" id="graph">
        <div class="empty">正在加载…</div>
        <div class="graph-tools" aria-label="节点图缩放">
          <button type="button" id="zoomOut" title="缩小">−</button>
          <span class="zoom-label" id="zoomLabel">100%</span>
          <button type="button" id="zoomIn" title="放大">＋</button>
          <button type="button" id="fitAll" title="适应画布">适应</button>
          <button type="button" id="fitOne" title="实际大小">1:1</button>
        </div>
      </div>
    </section>

    <div class="right-rail">
      <section class="card run-card">
        <div class="card-head"><strong>运行</strong><span class="hint" id="runHint"></span></div>
        <div class="run-summary" id="runSummary"></div>
        <div class="run-actions">
          <button class="btn primary" id="runBtn" type="button">继续运行</button>
          <button class="btn" id="stopBtn" type="button" disabled>停止当前执行</button>
        </div>
        <label class="control-row"><span>连续运行</span><input type="checkbox" id="continuousToggle"><span class="control-hint" id="controlHint"></span></label>
      </section>

      <section class="card queue-card">
        <div class="card-head"><strong>需求队列</strong><span class="hint" id="queueHint"></span></div>
        <div class="queue-list" id="queueList"></div>
      </section>

      <section class="card human-card">
        <div class="card-head"><strong>Human 待办</strong><span class="hint" id="humanHint"></span></div>
        <div class="human-todo" id="humanTodo"></div>
      </section>
    </div>
  </div>

  <section class="card detail-card hide" id="detailCard">
    <div class="card-head">
      <strong>节点详情</strong>
      <span class="hint" id="detailHint"></span>
      <span class="spacer"></span>
      <button class="icon-btn" id="closeDetail" type="button" title="关闭节点详情" aria-label="关闭节点详情">×</button>
    </div>
    <div class="detail-body" id="detailBody"></div>
  </section>
</main>

<div class="toast" id="toast" hidden></div>

<script>
(function () {
  "use strict";

  const PUBLIC = location.pathname.includes("/public/");
  const API = window.__BOARD_API_BASE__ || (PUBLIC ? "/plugins/dsh-agent-team-workflow/public/api" : "/plugins/dsh-agent-team-workflow/api");
  const SESSION = new URLSearchParams(location.search).get("session") || "";
  const BOARD_TOKEN = new URLSearchParams(location.search).get("token") || "";
  const STATUS = { running: "运行中", waiting: "等待决策", done: "已完成", failed: "失败", paused: "已暂停", interrupted: "已中断，需检查" };
  const TOKEN = { ready: "就绪", running: "执行中", waiting: "等待", completed: "已完成", failed: "失败", interrupted: "已中断" };
  const TYPE = { agent: "模型", command: "命令", http: "HTTP", human: "人工", fanout: "扇出", join: "聚合", gate: "开关", subworkflow: "子流程" };
  const STYLE = {
    agent: { color: "#4f7cff", glyph: "✦" },
    command: { color: "#b06b12", glyph: ">_" },
    http: { color: "#3b82f6", glyph: "⇄" },
    human: { color: "#8b5cf6", glyph: "☑" },
    fanout: { color: "#64748b", glyph: "Y" },
    join: { color: "#0f766e", glyph: "⋈" },
    gate: { color: "#7c3aed", glyph: "⏻" },
    subworkflow: { color: "#2f8a55", glyph: "▣" }
  };

  let state = null;
  let selected = null;
  let graphSize = { width: 0, height: 0 };
  let view = { scale: 1, tx: 0, ty: 0, initialized: false };
  let drag = null;
  let suppressClick = false;
  let busy = false;
  let toastTimer = null;
  const noteDrafts = new Map();
  const modelDrafts = new Map();
  let loading = false;

  const $ = id => document.getElementById(id);
  const withToken = url => BOARD_TOKEN ? url + (url.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(BOARD_TOKEN) : url;

  function esc(value) {
    return String(value ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  }
  function clip(value, max) {
    const text = String(value ?? "");
    const width = Array.from(text).reduce((sum, ch) => sum + (/[\u3000-\u9fff\uff00-\uffef]/.test(ch) ? 10.5 : 5.9), 0);
    if (width <= max) return text;
    let out = "";
    let used = 0;
    for (const ch of text) {
      const step = /[\u3000-\u9fff\uff00-\uffef]/.test(ch) ? 10.5 : 5.9;
      if (used + step > max - 8) break;
      out += ch;
      used += step;
    }
    return out + "…";
  }
  function wrap(text, max) {
    const lines = [];
    let line = "", width = 0;
    const stepOf = ch => /[\u3000-\u9fff\uff00-\uffef]/.test(ch) ? 12.2 : 6.9;
    const push = token => {
      const tokenWidth = Array.from(token).reduce((sum, ch) => sum + stepOf(ch), 0);
      if (width + tokenWidth <= max) { line += token; width += tokenWidth; return; }
      if (line.trim()) { lines.push(line.trim()); line = ""; width = 0; }
      if (tokenWidth <= max) { line = token; width = tokenWidth; return; }
      for (const ch of token) {
        const step = stepOf(ch);
        if (width + step > max && line) { lines.push(line); line = ""; width = 0; }
        line += ch;
        width += step;
      }
    };
    for (const token of String(text || "").match(/[\u4e00-\u9fff]|[^\s]+|\s+/g) || []) push(token);
    if (line.trim()) lines.push(line.trim());
    if (lines.length > 2) {
      lines.length = 2;
      lines[1] = clip(lines[1], max - 8) + "…";
    }
    return lines.length ? lines : [""];
  }
  function latest(tokens) {
    const map = new Map();
    for (const token of tokens || []) map.set(token.nodeId, token);
    return map;
  }
  function tone(status) {
    if (status === "running") return "running";
    if (status === "waiting") return "wait";
    if (status === "failed") return "failed";
    if (status === "completed") return "done";
    return "";
  }
  function modelsOf(node) {
    if (Array.isArray(node.config?.models) && node.config.models.length) return node.config.models;
    const lane = (state.definition.providers || []).find(entry => entry.id === node.config?.lane);
    const provider = node.config?.provider || lane?.adapter;
    const model = node.config?.model || lane?.model;
    return provider && model && model !== "host-default" ? [{ provider, model }] : [];
  }
  function modelText(node) {
    if (node.type !== "agent") return "";
    const models = modelsOf(node);
    if (models.length === 0) return "宿主默认";
    const first = models[0];
    return (first.model || first.provider || "") + (models.length > 1 ? " +" + (models.length - 1) : "");
  }
  function detailText(node) {
    if (node.type === "command") return node.config?.command || "";
    if (node.type === "http") return [node.config?.method || "GET", node.config?.url || ""].join(" ");
    if (node.type === "human") return Array.isArray(node.config?.outcomes) ? node.config.outcomes.join(" / ") : "人工决策";
    if (node.type === "fanout") return node.config?.items || "";
    if (node.type === "join") return node.config?.mode || "all";
    if (node.type === "subworkflow") return "内联子流程";
    if (node.type === "gate") return "连续运行开关";
    return modelText(node);
  }
  function toast(text, bad) {
    const node = $("toast");
    node.textContent = text;
    node.className = "toast" + (bad ? " bad" : "");
    node.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { node.hidden = true; }, 3600);
  }

  async function getJson(url) {
    const response = await fetch(withToken(url), { cache: "no-store", headers: { accept: "application/json" } });
    const body = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(body?.error?.message || ("HTTP " + response.status));
    return body;
  }
  async function postJson(url, body) {
    const response = await fetch(withToken(url), { method: "POST", headers: { "content-type": "application/json", accept: "application/json" }, body: JSON.stringify(body) });
    const value = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(value?.error?.message || ("HTTP " + response.status));
    return value;
  }
  function applyState(next) {
    const control = state?.control;
    const queue = state?.queue;
    const models = state?.models;
    state = next;
    if (state.control === undefined) state.control = control;
    if (state.queue === undefined) state.queue = queue;
    if (state.models === undefined) state.models = models;
  }

  async function load() {
    if (!SESSION || loading) return;
    loading = true;
    try {
      applyState(await getJson(API + "/state?session=" + encodeURIComponent(SESSION)));
      try { state.models = await getJson(API + "/models?session=" + encodeURIComponent(SESSION)); } catch {}
      render();
    } catch (error) {
      toast("刷新失败（保留现有画布）：" + error.message, true);
    } finally { loading = false; }
  }

  /* ------------------------------------------------------------------ layout */

  function longestRanks(definition) {
    const nodes = definition.nodes;
    const order = new Map(nodes.map((node, index) => [node.id, index]));
    const incoming = new Map(nodes.map(node => [node.id, []]));
    const outgoing = new Map(nodes.map(node => [node.id, []]));
    for (const edge of definition.edges) {
      if (!incoming.has(edge.to) || !outgoing.has(edge.from)) continue;
      outgoing.get(edge.from).push(edge);
    }
    // Feedback edges must not become rank constraints, or an entry node with a
    // reject/revision edge pointing back to it falls to the bottom of the graph.
    const state = new Map();
    const visitEdges = id => {
      if (state.get(id) === 1 || state.get(id) === 2) return;
      state.set(id, 1);
      for (const edge of outgoing.get(id) || []) {
        if (state.get(edge.to) === 1) continue;
        const list = incoming.get(edge.to);
        if (!list.includes(id)) list.push(id);
        visitEdges(edge.to);
      }
      state.set(id, 2);
    };
    for (const node of nodes) visitEdges(node.id);
    const rank = new Map();
    const visiting = new Set();
    const visit = id => {
      if (rank.has(id)) return rank.get(id);
      if (visiting.has(id)) return 0;
      visiting.add(id);
      let value = 0;
      for (const from of incoming.get(id) || []) value = Math.max(value, visit(from) + 1);
      visiting.delete(id);
      rank.set(id, value);
      return value;
    };
    for (const node of nodes) visit(node.id);
    const groups = new Map();
    for (const node of [...nodes].sort((a, b) => order.get(a.id) - order.get(b.id))) {
      const value = rank.get(node.id) || 0;
      if (!groups.has(value)) groups.set(value, []);
      groups.get(value).push(node);
    }
    return { rank, groups, incoming };
  }

  function orderRanks(groups, incoming) {
    const keys = [...groups.keys()].sort((a, b) => a - b);
    const position = new Map();
    for (const key of keys) groups.get(key).forEach((node, index) => position.set(node.id, index));
    const distance = (node, neighbors) => {
      if (!neighbors.length) return position.get(node.id) || 0;
      return neighbors.reduce((sum, id) => sum + (position.get(id) || 0), 0) / neighbors.length;
    };
    for (let pass = 0; pass < 4; pass += 1) {
      for (const key of keys.slice(1)) {
        const list = groups.get(key);
        list.sort((a, b) => distance(a, incoming.get(a.id) || []) - distance(b, incoming.get(b.id) || []) || (position.get(a.id) || 0) - (position.get(b.id) || 0));
        list.forEach((node, index) => position.set(node.id, index));
      }
      for (const key of [...keys].reverse().slice(1)) {
        const list = groups.get(key);
        const next = groups.get(key + 1) || [];
        const score = node => distance(node, (incoming.get(node.id) || []).filter(id => next.some(item => item.id === id)));
        list.sort((a, b) => score(a) - score(b) || (position.get(a.id) || 0) - (position.get(b.id) || 0));
        list.forEach((node, index) => position.set(node.id, index));
      }
    }
  }

  function portOf(node, side, fraction) {
    if (side === "bottom") return { x: node.x + node.w * fraction, y: node.y + node.h, nx: 0, ny: 1 };
    if (side === "top") return { x: node.x + node.w * fraction, y: node.y, nx: 0, ny: -1 };
    if (side === "right") return { x: node.x + node.w, y: node.y + node.h * fraction, nx: 1, ny: 0 };
    return { x: node.x, y: node.y + node.h * fraction, nx: -1, ny: 0 };
  }

  function orthogonalize(points) {
    const out = [];
    const add = point => {
      const last = out[out.length - 1];
      if (!last || Math.abs(last.x - point.x) > 0.8 || Math.abs(last.y - point.y) > 0.8) out.push(point);
    };
    for (const point of points) {
      const last = out[out.length - 1];
      if (last && Math.abs(last.x - point.x) > 0.8 && Math.abs(last.y - point.y) > 0.8) {
        if (Math.abs(point.x - last.x) >= Math.abs(point.y - last.y)) add({ x: point.x, y: last.y });
        else add({ x: last.x, y: point.y });
      }
      add(point);
    }
    return out;
  }

  function roundedPath(points, radius = 7) {
    points = orthogonalize(points);
    if (!points.length) return "";
    if (points.length === 1) return "M" + points[0].x + " " + points[0].y;
    let d = "M" + points[0].x + " " + points[0].y;
    for (let index = 1; index < points.length - 1; index += 1) {
      const prev = points[index - 1], current = points[index], next = points[index + 1];
      const inLength = Math.hypot(prev.x - current.x, prev.y - current.y);
      const outLength = Math.hypot(next.x - current.x, next.y - current.y);
      const r = Math.min(radius, inLength / 2, outLength / 2);
      const before = { x: current.x + (prev.x - current.x) / (inLength || 1) * r, y: current.y + (prev.y - current.y) / (inLength || 1) * r };
      const after = { x: current.x + (next.x - current.x) / (outLength || 1) * r, y: current.y + (next.y - current.y) / (outLength || 1) * r };
      d += " L" + before.x + " " + before.y + " Q" + current.x + " " + current.y + " " + after.x + " " + after.y;
    }
    const last = points[points.length - 1];
    return d + " L" + last.x + " " + last.y;
  }

  function layout(definition) {
    const { rank, groups, incoming } = longestRanks(definition);
    orderRanks(groups, incoming);
    const nodeWidth = 340, nodeHeight = 100, gapY = 52, gapX = 24, sidePad = 120, topPad = 28;
    const keys = [...groups.keys()].sort((a, b) => a - b);
    const rowWidth = Math.max(nodeWidth, ...keys.map(key => groups.get(key).length * nodeWidth + (groups.get(key).length - 1) * gapX));
    const width = rowWidth + sidePad * 2;
    const height = topPad * 2 + keys.length * nodeHeight + Math.max(0, keys.length - 1) * gapY;
    const nodes = definition.nodes.map(node => {
      const value = rank.get(node.id) || 0;
      const list = groups.get(value) || [];
      const index = list.findIndex(item => item.id === node.id);
      const total = list.length * nodeWidth + (list.length - 1) * gapX;
      return { ...node, x: (width - total) / 2 + index * (nodeWidth + gapX), y: topPad + value * (nodeHeight + gapY), w: nodeWidth, h: nodeHeight };
    });
    const byId = new Map(nodes.map(node => [node.id, node]));
    const sideGroups = new Map();
    const edgeSides = definition.edges.map(edge => {
      const from = byId.get(edge.from), to = byId.get(edge.to);
      if (!from || !to) return null;
      const fromRank = rank.get(edge.from) || 0;
      const toRank = rank.get(edge.to) || 0;
      const back = toRank < fromRank;
      const long = toRank > fromRank + 1;
      let sourceSide = "bottom", targetSide = "top";
      if (back || long) { sourceSide = "right"; targetSide = "right"; }
      else if (toRank === fromRank) { sourceSide = "right"; targetSide = "left"; }
      const sourceKey = edge.from + ":" + sourceSide;
      const targetKey = edge.to + ":" + targetSide;
      if (!sideGroups.has(sourceKey)) sideGroups.set(sourceKey, []);
      if (!sideGroups.has(targetKey)) sideGroups.set(targetKey, []);
      sideGroups.get(sourceKey).push({ edge, end: "source" });
      sideGroups.get(targetKey).push({ edge, end: "target" });
      return { edge, fromRank, toRank, back, long, sourceSide, targetSide };
    }).filter(Boolean);
    const fraction = (nodeId, side, edge, end) => {
      const list = sideGroups.get(nodeId + ":" + side) || [];
      const index = list.findIndex(item => item.edge === edge && item.end === end);
      return (index + 1) / (list.length + 1);
    };
    const sideEdges = edgeSides.filter(item => item.sourceSide === "right" || item.sourceSide === "left");
    sideEdges.forEach((item, index) => {
      item.lane = item.sourceSide === "right" ? width - 28 - (index % 5) * 16 : 28 + (index % 5) * 16;
    });
    const channels = new Map();
    for (const item of edgeSides) {
      if (item.toRank !== item.fromRank + 1 || item.sourceSide !== "bottom") continue;
      if (!channels.has(item.fromRank)) channels.set(item.fromRank, []);
      channels.get(item.fromRank).push(item);
    }
    for (const list of channels.values()) {
      list.sort((a, b) => (byId.get(a.edge.from).x || 0) - (byId.get(b.edge.from).x || 0));
      list.forEach((item, index) => { item.channelOffset = (index - (list.length - 1) / 2) * 8; });
    }
    const rendered = [];
    for (const item of edgeSides) {
      const { edge, sourceSide, targetSide, back, long } = item;
      const from = byId.get(edge.from), to = byId.get(edge.to);
      if (!from || !to) continue;
      const source = portOf(from, sourceSide, fraction(edge.from, sourceSide, edge, "source"));
      const target = portOf(to, targetSide, fraction(edge.to, targetSide, edge, "target"));
      let points;
      let label;
      if (item.toRank === item.fromRank + 1 && sourceSide === "bottom") {
        const channelY = (from.y + from.h + to.y) / 2 + (item.channelOffset || 0);
        if (Math.abs(source.x - target.x) < 1) {
          points = [{ x: source.x, y: source.y }, { x: target.x, y: target.y }];
          label = { x: source.x + 14, y: (source.y + target.y) / 2 };
        } else {
          points = [{ x: source.x, y: source.y }, { x: source.x, y: channelY }, { x: target.x, y: channelY }, { x: target.x, y: target.y }];
          label = { x: (source.x + target.x) / 2, y: channelY + 12 };
        }
      } else if (item.toRank === item.fromRank) {
        const lane = (from.x + from.w + to.x) / 2;
        points = [{ x: source.x, y: source.y }, { x: lane, y: source.y }, { x: lane, y: target.y }, { x: target.x, y: target.y }];
        label = { x: lane, y: Math.max(16, (source.y + target.y) / 2 - 12) };
      } else {
        const lane = item.lane ?? width - 40;
        points = [{ x: source.x, y: source.y }, { x: lane, y: source.y }, { x: lane, y: target.y }, { x: target.x, y: target.y }];
        label = (!back && long)
          ? { x: Math.max(30, source.x - 34), y: Math.max(16, source.y - 12) }
          : { x: Math.min(width - 30, source.x + 36), y: Math.max(16, source.y - 12) };
      }
      rendered.push({ d: roundedPath(points), lx: Math.max(30, Math.min(width - 30, label.x)), ly: Math.max(14, Math.min(height - 14, label.y)), label: edge.on || "complete" });
    }
    return { width, height, nodes, edges: rendered };
  }

  /* ------------------------------------------------------------------ render */

  function applyView() {
    const element = $("graph");
    const svg = element?.querySelector("svg");
    if (!svg) return;
    svg.style.transform = `translate(${view.tx}px, ${view.ty}px) scale(${view.scale})`;
    $("zoomLabel").textContent = Math.round(view.scale * 100) + "%";
  }

  function fitView(mode = "width") {
    const element = $("graph");
    if (!element || !graphSize.width || !graphSize.height) return;
    const width = element.clientWidth;
    const height = element.clientHeight;
    let scale;
    if (mode === "one") scale = 1;
    else if (mode === "all") scale = Math.min(1.1, (width - 48) / graphSize.width, (height - 48) / graphSize.height);
    else scale = Math.min(1, (width - 48) / graphSize.width);
    scale = Math.max(0.2, Math.min(2.5, scale));
    view.scale = scale;
    view.tx = (width - graphSize.width * scale) / 2;
    view.ty = mode === "all" ? (height - graphSize.height * scale) / 2 : 20;
    view.initialized = true;
    applyView();
  }

  function zoomAt(factor, x, y) {
    const element = $("graph");
    if (!element) return;
    const rect = element.getBoundingClientRect();
    const px = x ?? rect.width / 2;
    const py = y ?? rect.height / 2;
    const next = Math.max(0.2, Math.min(2.5, view.scale * factor));
    const ratio = next / view.scale;
    view.tx = px - (px - view.tx) * ratio;
    view.ty = py - (py - view.ty) * ratio;
    view.scale = next;
    view.initialized = true;
    applyView();
  }

  function renderGraph() {
    const definition = state.definition;
    const graph = layout(definition);
    graphSize = { width: graph.width, height: graph.height };
    const tokens = state.run?.tokens || [];
    const byNode = latest(tokens);
    const counts = new Map();
    for (const token of tokens) counts.set(token.nodeId, (counts.get(token.nodeId) || 0) + 1);
    const parts = [];
    parts.push('<svg viewBox="0 0 ' + graph.width + " " + graph.height + '" width="' + graph.width + '" height="' + graph.height + '" role="img" aria-label="工作流节点图">');
    parts.push('<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#97a1ad"/></marker></defs>');
    for (const edge of graph.edges) {
      parts.push('<path d="' + edge.d + '" fill="none" stroke="#97a1ad" stroke-width="1.35" stroke-linejoin="round" marker-end="url(#arrow)"/>');
      if (edge.label !== "complete") {
        const width = Math.max(22, edge.label.length * 5.2 + 10);
        parts.push('<rect x="' + (edge.lx - width / 2) + '" y="' + (edge.ly - 7) + '" width="' + width + '" height="14" rx="7" class="edge-pill"/>');
        parts.push('<text x="' + edge.lx + '" y="' + (edge.ly + 3) + '" text-anchor="middle" class="edge-label">' + esc(edge.label) + "</text>");
      }
    }
    for (const node of graph.nodes) {
      const token = byNode.get(node.id);
      const status = tone(token?.status);
      const style = STYLE[node.type] || { color: "#8a929e", glyph: "?" };
      const titleLines = wrap(node.title || node.id, 266);
      const metaY = node.y + (titleLines.length > 1 ? 58 : 48);
      const detailY = metaY + 16;
      const dotColor = status === "failed" ? "var(--bad)" : status === "wait" ? "var(--warn)" : status === "done" ? "var(--ok)" : status === "running" ? "var(--brand)" : "var(--line-strong)";
      const statusLabel = token ? (TOKEN[token.status] || token.status) : "";
      const classes = ["node-box", status, node.type === "human" ? "human" : "", selected === node.id ? "selected" : ""].filter(Boolean).join(" ");
      parts.push('<g class="node" data-node="' + esc(node.id) + '" role="button" tabindex="0" aria-label="' + esc(node.title || node.id) + '">');
      parts.push('<rect class="' + classes + '" x="' + node.x + '" y="' + node.y + '" width="' + node.w + '" height="' + node.h + '" rx="11"/>');
      parts.push('<rect x="' + (node.x + 1) + '" y="' + (node.y + 14) + '" width="2.5" height="' + (node.h - 28) + '" rx="1.25" fill="' + style.color + '" opacity=".65"/>');
      parts.push('<rect x="' + (node.x + 14) + '" y="' + (node.y + 14) + '" width="24" height="24" rx="7" fill="' + style.color + '"/>');
      parts.push('<text x="' + (node.x + 26) + '" y="' + (node.y + 30) + '" text-anchor="middle" class="node-glyph">' + esc(style.glyph) + "</text>");
      parts.push('<text x="' + (node.x + 48) + '" y="' + (node.y + 24) + '" class="node-title">');
      titleLines.forEach((line, index) => parts.push('<tspan x="' + (node.x + 48) + '" dy="' + (index ? 16 : 0) + '">' + esc(line) + "</tspan>"));
      parts.push("</text>");
      const meta = (TYPE[node.type] || node.type) + (node.role ? " · " + node.role : "");
      parts.push('<text x="' + (node.x + 48) + '" y="' + metaY + '" class="node-meta">' + esc(clip(meta, 260)) + "</text>");
      parts.push('<text x="' + (node.x + 48) + '" y="' + detailY + '" class="node-detail-text">' + esc(clip(detailText(node), 290)) + "</text>");
      parts.push('<circle cx="' + (node.x + 16) + '" cy="' + (node.y + node.h - 14) + '" r="3.2" fill="' + dotColor + '" stroke="var(--panel)" stroke-width="1.4"/>');
      if (statusLabel) parts.push('<text x="' + (node.x + 24) + '" y="' + (node.y + node.h - 11) + '" class="node-status-label">' + esc(statusLabel) + "</text>");
      const count = counts.get(node.id) || 0;
      if (count) {
        parts.push('<circle cx="' + (node.x + node.w - 16) + '" cy="' + (node.y + 16) + '" r="9" fill="var(--panel-2)" stroke="var(--line)"/>');
        parts.push('<text x="' + (node.x + node.w - 16) + '" y="' + (node.y + 19) + '" text-anchor="middle" class="node-count">' + count + "</text>");
      }
      parts.push("</g>");
    }
    parts.push("</svg>");
    const element = $("graph");
    const tools = element.querySelector(".graph-tools");
    element.innerHTML = parts.join("");
    if (tools) element.append(tools);
    if (!view.initialized) fitView("width");
    else applyView();
  }

  function formatTime(value) {
    if (!value) return "";
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return "";
    return date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }

  function renderRun() {
    const run = state.run;
    $("runHint").textContent = run?.runId || "尚未运行";
    const tokens = run?.tokens || [];
    const completed = tokens.filter(token => token.status === "completed").length;
    const waiting = run?.waiting || [];
    $("runSummary").innerHTML = run
      ? '<div><strong>' + esc(STATUS[run.status] || run.status) + '</strong> · ' + completed + ' / ' + tokens.length + ' 个节点完成</div>' +
        '<div>等待人工：' + waiting.length + ' · 失败：' + tokens.filter(token => token.status === "failed").length + '</div>' +
        '<div style="overflow-wrap:anywhere">工作目录：' + esc(run.cwd || '未绑定，禁止执行') + '</div>' +
        '<div style="overflow-wrap:anywhere">作业：' + esc(run.jobId || '未调度') + (run.execution?.active ? ' · 执行中' : '') + '</div>' +
        '<div>当前节点：' + esc(run.current?.nodeId || '—') + ' · ' + esc(TOKEN[run.current?.status] || run.current?.status || '—') + '</div>' +
        (run.current?.activity?.childId ? '<div style="overflow-wrap:anywhere">子 agent：' + esc(run.current.activity.childId) + '</div>' : '') +
        '<div>最近保存：' + esc(run.updatedAt || '—') + '</div>' +
        (run.pauseReason ? '<div>暂停原因：' + esc(run.pauseReason) + '</div>' : '') +
        (run.error ? '<div style="color:var(--bad);overflow-wrap:anywhere">' + esc(run.error) + '</div>' : '')
      : '<div>还没有运行记录。工作流由助手启动；启动后这里显示状态和人工决策。</div>';
    $("runBtn").disabled = !run || Boolean(run.execution?.active) || ["done", "failed", "interrupted"].includes(run.status) || !run.cwd || busy;
    $("stopBtn").disabled = !run?.execution?.active;
    renderHuman();
  }

  function renderHuman() {
    const run = state.run;
    for (const field of $("humanTodo").querySelectorAll("[data-note]")) noteDrafts.set(field.dataset.note, field.value);
    const focus = document.activeElement?.dataset?.note;
    const selectionStart = focus ? document.activeElement.selectionStart : null;
    const selectionEnd = focus ? document.activeElement.selectionEnd : null;
    const waiting = run?.waiting || [];
    const tokens = run?.tokens || [];
    $("humanHint").innerHTML = waiting.length ? '<span class="human-count">' + waiting.length + "</span>" : "";
    const items = waiting.map(item => {
      const token = tokens.find(candidate => candidate.id === item.tokenId);
      const node = state.definition.nodes.find(candidate => candidate.id === item.nodeId);
      const outcomes = Array.isArray(item.outcomes) ? item.outcomes : (node?.config?.outcomes || []);
      return '<div class="human-item"><div class="human-item-title">' + esc(item.title || node?.title || item.nodeId) + '</div>' +
        '<div class="human-item-meta">' + esc(item.nodeId) + ' · 人工节点' + (token?.createdAt ? ' · ' + esc(formatTime(token.createdAt)) : '') + '</div>' +
        '<textarea class="human-item-note" data-note="' + esc(item.tokenId) + '" placeholder="可选：审批留言/修改意见">' + esc(noteDrafts.get(item.tokenId) || "") + '</textarea>' +
        '<div class="human-item-actions">' + outcomes.map(outcome =>
          '<button class="btn ' + (outcome === "reject" ? "reject" : "primary") + '" data-token="' + esc(item.tokenId) + '" data-outcome="' + esc(outcome) + '">' + esc(outcome) + "</button>"
        ).join("") + '</div></div>';
    }).join("");
    const humanNodes = new Set(state.definition.nodes.filter(node => node.type === "human").map(node => node.id));
    const history = tokens
      .filter(token => humanNodes.has(token.nodeId) && (token.status === "completed" || token.status === "failed"))
      .slice(-6)
      .reverse();
    const historyHtml = history.length
      ? '<div class="human-history"><div class="human-history-title">最近决策</div>' + history.map(token => {
          const node = state.definition.nodes.find(candidate => candidate.id === token.nodeId);
          return '<div class="human-history-item"><strong>' + esc(node?.title || token.nodeId) + '</strong><span>' + esc(token.outcome || TOKEN[token.status] || token.status) + (token.updatedAt ? ' · ' + esc(formatTime(token.updatedAt)) : '') + '</span></div>';
        }).join("") + "</div>"
      : "";
    $("humanTodo").innerHTML = (items || '<div class="human-empty">当前没有待人工处理的事项。<br>工作流停在 human 节点时会出现在这里。</div>') + historyHtml;
    if (focus) {
      const field = [...$("humanTodo").querySelectorAll("[data-note]")].find(item => item.dataset.note === focus);
      field?.focus({preventScroll:true}); field?.setSelectionRange(selectionStart, selectionEnd);
    }
  }

  function renderControl() {
    const continuous = state.control?.continuous !== false;
    const paused = state.run?.status === "paused" || Boolean(state.run?.tokens?.some(token => token.status === "waiting" && token.reason === "gate_paused"));
    $("continuousToggle").checked = continuous;
    $("controlHint").textContent = continuous ? (paused ? "已开启，可继续" : "开") : (paused ? "已暂停，队列继续累计" : "下一节点前暂停");
  }

  function renderQueue() {
    const queue = state.queue;
    if (!queue) {
      $("queueHint").textContent = "";
      $("queueList").innerHTML = '<div class="queue-empty">无法读取需求队列；需要一次助手会话以确定仓库 cwd。</div>';
      return;
    }
    $("queueHint").textContent = queue.queued + " 待处理 · " + queue.seedsReady + " 种子";
    $("queueList").innerHTML = queue.items?.length
      ? queue.items.map(item => '<div class="queue-item"><div class="queue-item-title">' + esc(item.title) + '</div><div class="queue-item-meta"><span>' + esc(item.source || "queue") + '</span><span>priority ' + esc(item.priority ?? "—") + '</span>' + (item.tags || []).map(tag => '<span>#' + esc(tag) + '</span>').join("") + '</div></div>').join("")
      : '<div class="queue-empty">队列为空。<br>开关开启后，需求师会从种子池继续挖掘。</div>';
  }

  function modelProviders() {
    return Array.isArray(state.models?.providers) ? state.models.providers : [];
  }

  function modelDraft(node) {
    if (!modelDrafts.has(node.id)) {
      const models = Array.isArray(node.config?.models) && node.config.models.length
        ? node.config.models
        : (node.config?.provider && node.config?.model ? [{ provider: node.config.provider, model: node.config.model }] : []);
      modelDrafts.set(node.id, { models: structuredClone(models), dirty: false });
    }
    return modelDrafts.get(node.id);
  }

  function modelKey(provider, model) { return JSON.stringify([provider, model]); }

  function renderModelPicker(node) {
    const providers = modelProviders();
    const draft = modelDraft(node);
    const disabled = Boolean(state.run?.execution?.active) || busy;
    const attr = disabled ? ' disabled' : '';
    const chosen = new Set(draft.models.map(item => modelKey(item.provider, item.model)));
    const rows = draft.models.length ? draft.models.map((item, index) =>
      '<div class="model-row"><span class="model-index">' + (index + 1) + '</span><span class="model-name" title="' + esc(item.provider + ' / ' + item.model) + '">' + esc(item.provider) + ' / ' + esc(item.model) + '</span><span class="model-actions">' +
      '<button type="button" data-model-action="up" data-model-index="' + index + '" title="上移" aria-label="上移模型"' + (disabled || !index ? ' disabled' : '') + '>↑</button>' +
      '<button type="button" data-model-action="down" data-model-index="' + index + '" title="下移" aria-label="下移模型"' + (disabled || index === draft.models.length - 1 ? ' disabled' : '') + '>↓</button>' +
      '<button type="button" data-model-action="remove" data-model-index="' + index + '" title="移除" aria-label="移除模型"' + attr + '>×</button></span></div>'
    ).join('') : '<div class="model-empty">未指定模型：继承 lane / 宿主默认模型。</div>';
    const catalog = providers.length ? providers.map(provider => {
      const models = Array.isArray(provider.models) ? provider.models : [];
      return '<div class="model-provider"><strong>' + esc(provider.name || provider.id) + '</strong>' + models.map(model => {
        const selected = chosen.has(modelKey(provider.id, model.id));
        return '<label class="model-choice"><input type="checkbox" data-model-check data-provider="' + esc(provider.id) + '" data-model="' + esc(model.id) + '"' + (selected ? ' checked' : '') + (disabled || (!selected && draft.models.length >= 8) ? ' disabled' : '') + '><span>' + esc(model.name || model.id) + '<small>' + esc(model.id) + '</small></span></label>';
      }).join('') + '</div>';
    }).join('') : '<div class="model-empty">模型目录暂不可用；已保存的模型顺序仍保留。</div>';
    return '<section class="detail-section model-editor" data-model-editor><div class="detail-section-head">模型调用顺序<span class="spacer"></span>' + draft.models.length + ' / 8' + (draft.dirty ? ' · 未保存' : '') + '</div>' +
      '<div class="model-list">' + rows + '</div>' +
      '<details class="model-catalog"><summary>选择模型（可多选，按勾选顺序追加）</summary><div class="model-catalog-items">' + catalog + '</div></details>' +
      '<div class="model-add"><button class="btn primary" type="button" data-model-save' + (disabled || !draft.dirty ? ' disabled' : '') + '>保存模型顺序</button><button class="btn" type="button" data-model-clear' + attr + '>恢复默认</button></div>' +
      '<div class="model-help">一次节点执行按 1 → 2 → 3 调用；服务商/网络调用错误才尝试下一个。取消、超时、无效审批输出或审查不通过不会换模型重试。每次节点从首选模型开始，不是负载均衡。' + (disabled ? ' 当前作业执行中，请先暂停并等当前节点结束或停止作业后编辑。' : '') + '</div></section>';
  }

  function refreshModelPicker() {
    const node = state.definition.nodes.find(item => item.id === selected);
    const section = $("detailBody").querySelector("[data-model-editor]");
    if (!node || !section) return;
    const open = section.querySelector(".model-catalog")?.open;
    const scroll = section.querySelector(".model-catalog-items")?.scrollTop || 0;
    section.outerHTML = renderModelPicker(node);
    const replacement = $("detailBody").querySelector("[data-model-editor]");
    if (replacement && open) replacement.querySelector(".model-catalog").open = true;
    if (replacement) replacement.querySelector(".model-catalog-items").scrollTop = scroll;
  }

  function renderDetail() {
    const card = $("detailCard");
    if (!selected || !state.definition) { card.classList.add("hide"); return; }
    const node = state.definition.nodes.find(item => item.id === selected);
    if (!node) { card.classList.add("hide"); return; }
    const tokens = state.run?.tokens || [];
    const history = tokens.filter(token => token.nodeId === selected);
    const token = history[history.length - 1];
    const definition = state.definition;
    const incoming = definition.edges.filter(edge => edge.to === selected);
    const outgoing = definition.edges.filter(edge => edge.from === selected);
    const nodeContext = state.run?.context?.nodes?.[selected] ?? null;
    const model = token?.model ? [token.model.provider, token.model.model].filter(Boolean).join(" / ") : "";
    const status = token ? (TOKEN[token.status] || token.status) : "未执行";
    const links = (edges, empty) => edges.length
      ? edges.map(edge => '<button class="node-chip" type="button" data-select-node="' + esc(edge.from === selected ? edge.to : edge.from) + '"><span>' + esc(edge.from === selected ? edge.to : edge.from) + '</span><span class="edge-on">' + esc(edge.on || "complete") + "</span></button>").join("")
      : '<span class="human-empty" style="padding:0">' + empty + "</span>";
    const tokenRows = history.length
      ? history.map((item, index) => '<div class="detail-token' + (item.id === token?.id ? " active" : "") + '"><span class="run-status">' + esc(TOKEN[item.status] || item.status) + '</span><span class="run-outcome">' + esc(item.outcome || item.error?.code || "—") + (item.attempt ? ' · #' + item.attempt : '') + '</span><span class="run-time">' + esc(formatTime(item.updatedAt || item.createdAt)) + "</span></div>").join("")
      : '<div class="human-empty" style="padding:0">该节点还未执行。</div>';
    const section = (title, value, className) => value === undefined || value === null
      ? ""
      : '<section class="detail-section ' + (className || "") + '"><div class="detail-section-head">' + title + '</div><pre class="detail-pre">' + esc(JSON.stringify(value, null, 2)) + "</pre></section>";
    card.classList.remove("hide");
    const modelCatalogOpen = $("detailBody").querySelector(".model-catalog")?.open;
    const modelCatalogScroll = $("detailBody").querySelector(".model-catalog-items")?.scrollTop || 0;
    $("detailHint").textContent = node.id + " · " + (TYPE[node.type] || node.type);
    $("detailBody").innerHTML =
      '<div class="detail-side"><dl class="detail-kv">' +
        '<dt>节点</dt><dd>' + esc(node.id) + '</dd>' +
        '<dt>标题</dt><dd>' + esc(node.title || node.id) + '</dd>' +
        '<dt>类型</dt><dd>' + esc(TYPE[node.type] || node.type) + '</dd>' +
        (node.role ? '<dt>角色</dt><dd>' + esc(node.role) + '</dd>' : '') +
        '<dt>状态</dt><dd>' + esc(status) + '</dd>' +
        (token ? '<dt>尝试</dt><dd>#' + token.attempt + '</dd>' : '') +
        (model ? '<dt>模型</dt><dd>' + esc(model) + '</dd>' : '') +
        (token?.createdAt ? '<dt>开始</dt><dd>' + esc(token.createdAt) + '</dd>' : '') +
        (token?.updatedAt ? '<dt>更新</dt><dd>' + esc(token.updatedAt) + '</dd>' : '') +
        '<dt>执行次数</dt><dd>' + history.length + '</dd>' +
        (node.type === "human" ? '<dt>可选结果</dt><dd>' + esc((node.config?.outcomes || ["approve", "reject"]).join(" / ")) + '</dd>' : '') +
        (token?.branch ? '<dt>分支</dt><dd>#' + token.branch.index + '</dd>' : '') +
      '</dl>' +
      '<div class="detail-links"><div class="detail-links-title">上游</div>' + links(incoming, "无上游") + '</div>' +
      '<div class="detail-links"><div class="detail-links-title">下游</div>' + links(outgoing, "无下游") + '</div>' +
      '<section class="detail-section"><div class="detail-section-head">Token 历史<span class="spacer"></span>' + history.length + ' 条</div><div class="detail-token-list">' + tokenRows + '</div></section>' +
      '</div>' +
      '<div class="detail-main">' +
        section("最近输出", token?.output ?? null) +
        section("输入", token?.input ?? null) +
        section("运行上下文", nodeContext) +
        (token?.error ? section("错误", token.error, "detail-error") : "") +
        (node.type === "agent" ? renderModelPicker(node) : "") +
        section("节点配置", node.config ?? {}) +
      '</div>';
    const modelCatalog = $("detailBody").querySelector(".model-catalog");
    if (modelCatalog && modelCatalogOpen) modelCatalog.open = true;
    const modelItems = $("detailBody").querySelector(".model-catalog-items");
    if (modelItems) modelItems.scrollTop = modelCatalogScroll;
  }

  function render() {
    if (!state) return;
    if (!state.defined) {
      $("name").textContent = "工作流看板";
      $("sub").textContent = "当前会话还没有工作流";
      $("graph").innerHTML = '<div class="empty"><strong>还没有工作流</strong>让助手通过工具创建一个。</div>';
      return;
    }
    const definition = state.definition;
    $("name").textContent = definition.name;
    $("sub").textContent = definition.nodes.length + " 节点 · " + definition.edges.length + " 边";
    const status = $("status");
    status.className = "status " + (state.run ? state.run.status : "");
    status.textContent = state.run ? (STATUS[state.run.status] || state.run.status) : "未运行";
    $("graphHint").textContent = (state.run?.tokens?.length || 0) + " 次执行 · 拖拽/滚轮缩放";
    const command = state.permissions?.command;
    const http = state.permissions?.http;
    const commandText = command?.mode === "full" ? "完整" : command?.mode === "allowlist" ? "白名单" : "关闭";
    const httpText = http?.mode === "full" ? "完整" : http?.mode === "allowlist" ? "白名单" : "关闭";
    $("permCommand").textContent = "命令 " + commandText;
    $("permCommand").className = "perm " + (command?.mode && command.mode !== "deny" ? "on" : "");
    $("permHttp").textContent = "HTTP " + httpText;
    $("permHttp").className = "perm " + (http?.mode && http.mode !== "deny" ? "on" : "");
    $("legend").innerHTML = Object.entries(TYPE).map(([type, label]) => '<span><i style="background:' + STYLE[type].color + '"></i>' + label + "</span>").join("");
    renderGraph();
    renderRun();
    renderControl();
    renderQueue();
    renderDetail();
  }

  async function action(name) {
    if (busy || !state) return;
    if (name === "refresh") return load();
    if (name === "stop") {
      await postJson(API + "/stop", {session: SESSION});
      toast("已请求停止；等待当前执行清理并保存状态");
      return load();
    }
    if (name === "run") {
      if (!state.run?.runId) return;
      busy = true;
      $("runBtn").disabled = true;
      try {
        applyState(await postJson(API + "/run", { session: SESSION, runId: state.run.runId }));
        render();
      } catch (error) {
        toast(error.message, true);
      } finally {
        busy = false;
        renderRun();
      }
    }
  }

  async function saveNodeModels(models) {
    if (busy || !selected || state.run?.execution?.active) return;
    const nodeId = selected;
    busy = true;
    try {
      const result = await postJson(API + "/node-model", { session: SESSION, nodeId, models });
      applyState(result);
      if (result.models) state.models = result.models;
      modelDrafts.delete(nodeId);
      busy = false;
      render();
      toast(models.length ? "模型顺序已保存（调用失败时自动切换）" : "已恢复默认模型");
    } catch (error) {
      toast(error.message, true);
    } finally {
      busy = false;
      refreshModelPicker();
    }
  }

  async function decide(tokenId, outcome) {
    if (busy || !state) return;
    const field = [...document.querySelectorAll("[data-note]")].find(item => item.dataset.note === tokenId);
    const note = field?.value.trim() ?? "";
    const continuous = state.control?.continuous !== false;
    busy = true;
    try {
      applyState(await postJson(API + "/decide", { session: SESSION, runId: state.run?.runId, tokenId, outcome, output: note ? { note } : null }));
      if (continuous && state.run?.runId) {
        applyState(await postJson(API + "/run", { session: SESSION, runId: state.run.runId }));
      }
      noteDrafts.delete(tokenId);
      render();
      toast("已记录决策：" + outcome + (state.run?.execution?.active ? "，后续节点后台执行中" : ""));
    } catch (error) {
      toast(error.message, true);
    } finally {
      busy = false;
    }
  }

  async function setContinuous(value) {
    if (!state) return;
    try {
      const result = await postJson(API + "/control", { session: SESSION, continuous: value });
      state.control = result.control;
      if (value && state.run?.runId && !["done", "failed", "interrupted"].includes(state.run.status)) {
        applyState(await postJson(API + "/run", { session: SESSION, runId: state.run.runId }));
      }
      render();
    } catch (error) {
      toast(error.message, true);
    } finally {
      renderControl();
    }
  }

  $("refresh").addEventListener("click", () => action("refresh"));
  $("runBtn").addEventListener("click", () => action("run"));
  $("stopBtn").addEventListener("click", () => action("stop").catch(error => toast(error.message, true)));
  $("continuousToggle").addEventListener("change", event => setContinuous(event.target.checked));
  $("zoomOut").addEventListener("click", () => zoomAt(1 / 1.2));
  $("zoomIn").addEventListener("click", () => zoomAt(1.2));
  $("fitAll").addEventListener("click", () => fitView("all"));
  $("fitOne").addEventListener("click", () => fitView("one"));
  $("closeDetail").addEventListener("click", () => { selected = null; renderDetail(); });
  $("humanTodo").addEventListener("click", event => {
    const button = event.target.closest("[data-token][data-outcome]");
    if (button) decide(button.dataset.token, button.dataset.outcome);
  });
  $("detailBody").addEventListener("change", event => {
    const checkbox = event.target.closest("[data-model-check]");
    if (!checkbox || state.run?.execution?.active) return;
    const node = state.definition.nodes.find(item => item.id === selected);
    if (!node || node.type !== "agent") return;
    const draft = modelDraft(node);
    const key = modelKey(checkbox.dataset.provider, checkbox.dataset.model);
    if (checkbox.checked && !draft.models.some(item => modelKey(item.provider, item.model) === key)) {
      if (draft.models.length >= 8) { checkbox.checked = false; toast("最多选择 8 个模型", true); return; }
      draft.models.push({ provider: checkbox.dataset.provider, model: checkbox.dataset.model });
    } else if (!checkbox.checked) {
      draft.models = draft.models.filter(item => modelKey(item.provider, item.model) !== key);
    }
    draft.dirty = true;
    refreshModelPicker();
  });

  $("detailBody").addEventListener("click", event => {
    const node = state.definition.nodes.find(item => item.id === selected);
    if (event.target.closest("[data-model-save]")) {
      if (node) saveNodeModels(structuredClone(modelDraft(node).models));
      return;
    }
    if (event.target.closest("[data-model-clear]")) { saveNodeModels([]); return; }
    const action = event.target.closest("[data-model-action]");
    if (action && node && !state.run?.execution?.active) {
      const draft = modelDraft(node), index = Number(action.dataset.modelIndex);
      if (!Number.isInteger(index) || index < 0 || index >= draft.models.length) return;
      if (action.dataset.modelAction === "remove") draft.models.splice(index, 1);
      else {
        const next = index + (action.dataset.modelAction === "up" ? -1 : 1);
        if (next < 0 || next >= draft.models.length) return;
        [draft.models[index], draft.models[next]] = [draft.models[next], draft.models[index]];
      }
      draft.dirty = true;
      refreshModelPicker();
      return;
    }
    const link = event.target.closest("[data-select-node]");
    if (!link) return;
    selected = link.dataset.selectNode;
    renderGraph(); renderDetail();
    $("detailCard").scrollIntoView({ behavior: "smooth", block: "nearest" });
  });

  const graphElement = $("graph");
  graphElement.addEventListener("pointerdown", event => {
    if (event.button !== 0 || event.target.closest(".graph-tools")) return;
    drag = { x: event.clientX, y: event.clientY, tx: view.tx, ty: view.ty, moved: false, captured: false };
    graphElement.classList.add("dragging");
  });
  graphElement.addEventListener("pointermove", event => {
    if (!drag) return;
    const dx = event.clientX - drag.x;
    const dy = event.clientY - drag.y;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) drag.moved = true;
    if (drag.moved && !drag.captured) {
      graphElement.setPointerCapture(event.pointerId);
      drag.captured = true;
    }
    view.tx = drag.tx + dx;
    view.ty = drag.ty + dy;
    applyView();
  });
  const endDrag = event => {
    if (!drag) return;
    suppressClick = drag.moved;
    const captured = drag.captured;
    drag = null;
    graphElement.classList.remove("dragging");
    if (captured && graphElement.hasPointerCapture?.(event.pointerId)) graphElement.releasePointerCapture(event.pointerId);
    if (suppressClick) setTimeout(() => { suppressClick = false; }, 0);
  };
  graphElement.addEventListener("pointerup", endDrag);
  graphElement.addEventListener("pointercancel", endDrag);
  graphElement.addEventListener("wheel", event => {
    if (event.target.closest(".graph-tools")) return;
    event.preventDefault();
    const rect = graphElement.getBoundingClientRect();
    zoomAt(Math.exp(-event.deltaY * 0.0015), event.clientX - rect.left, event.clientY - rect.top);
  }, { passive: false });

  $("graph").addEventListener("click", event => {
    if (suppressClick) { suppressClick = false; return; }
    const node = event.target.closest("[data-node]");
    if (!node) return;
    selected = node.getAttribute("data-node");
    renderGraph();
    renderDetail();
    $("detailCard").scrollIntoView({ behavior: "smooth", block: "nearest" });
  });
  $("graph").addEventListener("keydown", event => {
    if (event.key !== "Enter" && event.key !== " ") return;
    const node = event.target.closest("[data-node]");
    if (!node) return;
    event.preventDefault();
    selected = node.getAttribute("data-node");
    renderGraph();
    renderDetail();
  });
  window.addEventListener("resize", () => { if (view.initialized) applyView(); });

  if (!SESSION) {
    $("graph").innerHTML = '<div class="empty"><strong>缺少 session 参数</strong>URL 需要 ?session=&lt;session-id&gt;。</div>';
  } else {
    load();
    setInterval(() => { if (!document.hidden && !busy) load(); }, 5000);
  }
})();
</script>
</body>
</html>
