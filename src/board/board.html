<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent-team-workflow · 看板</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8;
    --surface: #ffffff;
    --surface-2: #fafbfc;
    --border: #e2e5ea;
    --text: #1c2128;
    --muted: #68707d;
    --accent: #2563eb;
    --ok: #15803d;
    --warn: #b45309;
    --danger: #b91c1c;
    --radius: 8px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101318;
      --surface: #171b22;
      --surface-2: #1b2029;
      --border: #2a303b;
      --text: #e6e8ec;
      --muted: #98a1b0;
      --accent: #6ea8fe;
      --ok: #58c98a;
      --warn: #e0a458;
      --danger: #ef7a7a;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text); font: 14px/1.5 var(--font);
    display: flex; flex-direction: column; min-height: 100vh;
  }
  button { font: inherit; }
  header.topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
    padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .brand strong { font-size: 16px; font-weight: 650; white-space: nowrap; }
  .brand .sub { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 46vw; }
  .stats { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
  .stat {
    display: inline-flex; gap: 6px; align-items: baseline;
    padding: 3px 9px; border: 1px solid var(--border); border-radius: 999px;
    background: var(--surface-2); color: var(--muted); font-size: 12px; white-space: nowrap;
  }
  .stat b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .toolbar { display: flex; align-items: center; gap: 8px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 32px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.05); }
  .btn.ghost { background: transparent; }
  .btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
  .btn[disabled] { opacity: .55; cursor: progress; }
  .toggle { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
  main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; padding: 16px 20px 24px; align-items: start; }
  .board { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; align-items: flex-start; }
  .column {
    flex: 1 0 260px; min-width: 260px; max-width: 380px;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius);
    display: flex; flex-direction: column; max-height: calc(100vh - 150px);
  }
  .column-head { padding: 10px 12px; border-bottom: 1px solid var(--border); }
  .column-head h2 { margin: 0; font-size: 14px; font-weight: 650; }
  .column-head .muted { font-size: 12px; }
  .cards { padding: 10px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; }
  .card.status-blocked { border-left: 3px solid var(--warn); }
  .card.status-done { opacity: .78; }
  .card-top { display: flex; align-items: flex-start; gap: 8px; }
  .card-top h3 { margin: 0; font-size: 13.5px; font-weight: 600; line-height: 1.4; flex: 1; overflow-wrap: anywhere; }
  .chip { flex: none; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--border); font-size: 11.5px; color: var(--muted); background: var(--surface-2); white-space: nowrap; }
  .chip.active { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
  .chip.blocked { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, var(--border)); }
  .chip.done { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, var(--border)); }
  .meta { margin: 6px 0 0; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .gate-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .gate-actions .btn { min-height: 28px; padding: 0 10px; font-size: 12.5px; }
  .detail { margin-top: 8px; }
  .detail summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  .detail pre { margin: 6px 0 0; padding: 8px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; font-size: 11.5px; line-height: 1.45; max-height: 220px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
  .empty { color: var(--muted); font-size: 12.5px; margin: 2px 0; }
  aside.side { display: flex; flex-direction: column; gap: 12px; position: sticky; top: 76px; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; }
  .panel h2 { margin: 0 0 10px; font-size: 13px; font-weight: 650; display: flex; justify-content: space-between; align-items: baseline; }
  .panel h2 .count { color: var(--muted); font-weight: 500; }
  .decision { border-top: 1px solid var(--border); padding: 8px 0; }
  .decision:first-of-type { border-top: 0; padding-top: 0; }
  .decision p { margin: 0 0 6px; font-size: 13px; overflow-wrap: anywhere; }
  .decision .meta { margin: 0 0 6px; }
  .provider { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--border); }
  .provider:first-of-type { border-top: 0; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
  .dot.degraded { background: var(--warn); }
  .dot.blocked { background: var(--danger); }
  .provider .name { font-size: 13px; overflow-wrap: anywhere; }
  .provider .model { color: var(--muted); font-size: 11.5px; }
  .provider .load { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .flow { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .flow li { font-size: 12.5px; display: flex; gap: 8px; align-items: baseline; }
  .flow .role { color: var(--muted); font-size: 11.5px; margin-left: auto; white-space: nowrap; }
  .flow .arrow { color: var(--muted); font-size: 11px; }
  .error { margin: 0 20px; padding: 8px 12px; border: 1px solid var(--danger); color: var(--danger); border-radius: 6px; background: color-mix(in srgb, var(--danger) 8%, transparent); }
  footer { padding: 0 20px 16px; color: var(--muted); font-size: 12px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  dialog { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text); padding: 0; width: min(440px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(15, 20, 30, .38); }
  dialog form { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  dialog h2 { margin: 0; font-size: 15px; }
  dialog label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--muted); }
  dialog input, dialog textarea { font: inherit; color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 7px 9px; }
  dialog textarea { resize: vertical; min-height: 72px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12.5px; }
  dialog menu { display: flex; justify-content: flex-end; gap: 8px; margin: 4px 0 0; padding: 0; }
  .form-error { margin: 0; color: var(--danger); font-size: 12.5px; }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
    aside.side { position: static; }
    .brand .sub { max-width: 60vw; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <strong>agent-team-workflow</strong>
    <span class="sub" id="workflow-name">未连接</span>
    <span class="sub" id="workflow-desc"></span>
  </div>
  <div class="stats" id="stats"></div>
  <div class="toolbar">
    <label class="toggle"><input type="checkbox" id="auto" checked> 自动刷新</label>
    <button class="btn ghost" id="refresh" type="button">刷新</button>
    <button class="btn primary" id="new-item" type="button">新建任务</button>
  </div>
</header>

<p class="error" id="error" hidden></p>

<main>
  <section class="board" id="board" aria-label="工作流看板"></section>
  <aside class="side">
    <section class="panel">
      <h2>待决策 <span class="count" id="decision-count">0</span></h2>
      <div id="decisions"></div>
    </section>
    <section class="panel">
      <h2>模型线路</h2>
      <div id="providers"></div>
    </section>
    <section class="panel">
      <h2>流程</h2>
      <ol class="flow" id="workflow"></ol>
    </section>
  </aside>
</main>

<footer>
  <span id="updated">尚未载入</span>
  <span>状态来自本地事件日志；看板不会合并、关闭或推送任何分支。</span>
</footer>

<dialog id="enqueue-dialog">
  <form id="enqueue-form" method="dialog">
    <h2>新建任务</h2>
    <label>标题
      <input id="enqueue-title" name="title" maxlength="200" required placeholder="例如：为上传接口增加重试">
    </label>
    <label>输入 JSON（可选）
      <textarea id="enqueue-input" name="input" placeholder='{"prompt": "..."}'></textarea>
    </label>
    <label>优先级
      <input id="enqueue-priority" name="priority" type="number" step="1" value="0">
    </label>
    <p class="form-error" id="enqueue-error" hidden></p>
    <menu>
      <button class="btn ghost" value="cancel" type="submit">取消</button>
      <button class="btn primary" value="create" type="submit">创建</button>
    </menu>
  </form>
</dialog>

<script>
const ITEM_STATUS = { active: '进行中', blocked: '阻塞', done: '已完成', cancelled: '已取消' };
const TASK_STATUS = { pending: '待定', ready: '待领取', running: '执行中', completed: '已完成', failed: '失败', cancelled: '已取消' };
const GATE_STATUS = { pending: '待决策', approved: '已通过', rejected: '已拒绝' };
const HEALTH = { ok: '正常', degraded: '降级', blocked: '已封禁' };

const $ = id => document.getElementById(id);
let data = null;
let autoRefresh = true;

function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (value === undefined || value === null) continue;
    if (key === 'class') node.className = value;
    else if (key === 'text') node.textContent = value;
    else if (key.startsWith('on') && typeof value === 'function') node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value);
  }
  for (const child of children.flat(Infinity)) {
    if (child === undefined || child === null || child === false) continue;
    node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return node;
}

async function load() {
  try {
    const response = await fetch('/api/board', { headers: { accept: 'application/json' } });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    data = await response.json();
    $('error').hidden = true;
    render();
  } catch (error) {
    showError(`无法读取看板：${error.message}`);
  }
}

function showError(message) {
  const node = $('error');
  node.textContent = message;
  node.hidden = false;
}

function render() {
  if (!data) return;
  document.title = `${data.workflow.name} · agent-team-workflow`;
  $('workflow-name').textContent = data.workflow.name;
  $('workflow-desc').textContent = data.workflow.description || '';
  renderStats();
  renderBoard();
  renderDecisions();
  renderProviders();
  renderWorkflow();
  $('updated').textContent = `更新于 ${new Date(data.generatedAt).toLocaleTimeString()} · 事件投影`;
}

function renderStats() {
  const counts = data.counts;
  $('stats').replaceChildren(
    stat('任务', counts.items),
    stat('进行中', counts.active),
    stat('阻塞', counts.blocked),
    stat('已完成', counts.done),
    stat('执行中', `${counts.tasksRunning}/${counts.capacity}`),
    stat('待决策', counts.pendingGates),
  );
}

function stat(label, value) {
  return el('span', { class: 'stat' }, label, el('b', { text: String(value) }));
}

function renderBoard() {
  $('board').replaceChildren(...data.columns.map(column => {
    const cards = el('div', { class: 'cards' }, ...column.items.map(cardNode));
    if (column.items.length === 0) cards.append(el('p', { class: 'empty', text: '暂无任务' }));
    const providers = column.providers.length > 0 ? ` · ${column.providers.join(' / ')}` : '';
    return el('section', { class: 'column' },
      el('header', { class: 'column-head' },
        el('h2', { text: column.title }),
        el('span', { class: 'muted', text: `${column.role} · ${column.items.length}${providers}` }),
      ),
      cards,
    );
  }));
}

function cardNode(item) {
  const pending = item.gates.filter(gate => gate.status === 'pending');
  const meta = item.task
    ? [
        TASK_STATUS[item.task.status] ?? item.task.status,
        item.task.assignee ?? '未指派',
        item.task.provider ?? '自动选择线路',
        item.task.attemptCount > 1 ? `第 ${item.task.attemptCount} 次尝试` : null,
      ].filter(Boolean).join(' · ')
    : '没有活动任务';

  const gateActions = pending.length > 0
    ? el('div', { class: 'gate-actions' },
        ...pending.flatMap(gate => [
          el('button', {
            class: 'btn primary', type: 'button', text: `通过 ${gate.id}`,
            onclick: event => decide(event.currentTarget, item.id, gate.id, 'approve'),
          }),
          el('button', {
            class: 'btn danger', type: 'button', text: `拒绝 ${gate.id}`,
            onclick: event => decide(event.currentTarget, item.id, gate.id, 'reject'),
          }),
        ]),
      )
    : null;

  return el('article', { class: `card status-${item.status}` },
    el('div', { class: 'card-top' },
      el('h3', { text: item.title }),
      el('span', { class: `chip ${item.status}`, text: ITEM_STATUS[item.status] ?? item.status }),
    ),
    el('p', { class: 'meta', text: meta }),
    gateActions,
    el('details', { class: 'detail' },
      el('summary', { text: '详情' }),
      el('pre', { text: JSON.stringify({ id: item.id, task: item.task, gates: item.gates, contract: item.contract, result: item.result }, null, 2) }),
    ),
  );
}

function renderDecisions() {
  const pending = data.pendingGates;
  $('decision-count').textContent = String(pending.length);
  if (pending.length === 0) {
    $('decisions').replaceChildren(el('p', { class: 'empty', text: '没有等待中的决策' }));
    return;
  }
  $('decisions').replaceChildren(...pending.map(gate => el('div', { class: 'decision' },
    el('p', { text: gate.itemTitle }),
    el('p', { class: 'meta', text: `${gate.gate} · ${new Date(gate.updatedAt).toLocaleString()}` }),
    el('div', { class: 'gate-actions' },
      el('button', { class: 'btn primary', type: 'button', text: '通过', onclick: event => decide(event.currentTarget, gate.itemId, gate.gate, 'approve') }),
      el('button', { class: 'btn danger', type: 'button', text: '拒绝', onclick: event => decide(event.currentTarget, gate.itemId, gate.gate, 'reject') }),
    ),
  )));
}

function renderProviders() {
  if (data.providers.length === 0) {
    $('providers').replaceChildren(el('p', { class: 'empty', text: '未声明模型线路' }));
    return;
  }
  $('providers').replaceChildren(...data.providers.map(provider => el('div', { class: 'provider' },
    el('span', { class: `dot ${provider.health}`, title: HEALTH[provider.health] ?? provider.health }),
    el('span', {},
      el('span', { class: 'name', text: provider.id }),
      provider.model ? el('span', { class: 'model', text: ` · ${provider.model}` }) : null,
    ),
    el('span', { class: 'load', text: provider.concurrency ? `${provider.active}/${provider.concurrency}` : String(provider.active) }),
  )));
}

function renderWorkflow() {
  const stages = data.workflow.stages;
  $('workflow').replaceChildren(...stages.map((stage, index) => el('li', {},
    el('span', { text: `${index + 1}. ${stage.title}` }),
    el('span', { class: 'role', text: stage.role }),
  )));
}

async function decide(button, itemId, gate, decision) {
  const label = decision === 'approve' ? '通过' : '拒绝';
  if (!window.confirm(`${label} ${gate}？该决策会写入事件日志。`)) return;
  button.disabled = true;
  try {
    await post('/api/gate', { itemId, gate, decision, by: 'board' });
  } catch (error) {
    button.disabled = false;
    showError(`决策失败：${error.message}`);
  }
}

async function post(path, body) {
  const response = await fetch(path, {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify(body),
  });
  const payload = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(payload?.error?.message ?? `HTTP ${response.status}`);
  await load();
  return payload;
}

$('refresh').addEventListener('click', () => load());
$('auto').addEventListener('change', event => { autoRefresh = event.currentTarget.checked; });

$('new-item').addEventListener('click', () => {
  $('enqueue-error').hidden = true;
  $('enqueue-dialog').showModal();
  $('enqueue-title').focus();
});

$('enqueue-form').addEventListener('submit', async event => {
  event.preventDefault();
  if (event.submitter?.value === 'cancel') {
    $('enqueue-dialog').close();
    return;
  }
  const title = $('enqueue-title').value.trim();
  if (!title) return;
  let input = {};
  const raw = $('enqueue-input').value.trim();
  if (raw) {
    try {
      input = JSON.parse(raw);
    } catch (error) {
      const node = $('enqueue-error');
      node.textContent = `输入不是合法 JSON：${error.message}`;
      node.hidden = false;
      return;
    }
    if (typeof input !== 'object' || input === null || Array.isArray(input)) {
      const node = $('enqueue-error');
      node.textContent = '输入必须是 JSON 对象';
      node.hidden = false;
      return;
    }
  }
  const submit = event.submitter;
  if (submit) submit.disabled = true;
  try {
    await post('/api/enqueue', {
      title,
      input,
      priority: Number($('enqueue-priority').value || 0),
    });
    $('enqueue-dialog').close();
    $('enqueue-form').reset();
  } catch (error) {
    const node = $('enqueue-error');
    node.textContent = `创建失败：${error.message}`;
    node.hidden = false;
  } finally {
    if (submit) submit.disabled = false;
  }
});

load();
setInterval(() => {
  if (autoRefresh && !document.hidden) load();
}, 3000);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) load();
});
</script>
</body>
</html>
