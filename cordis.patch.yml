# agent-team-workflow bundle patch: mounts the plugin into a DSH profile.
#
# Install with `dsh plugin --profile <name> add <package-or-local-path>`.
# The plugin registers the `team_workflow_*` tools and one usage section into
# the global system prompt, so any session in the profile can create and run a
# workflow through natural language.
- insert:
    - id: agent-team-workflow
      name: 'agent-team-workflow'
      config:
        # Per-workspace state: <session cwd>/.agent-team-workflow
        stateDir: .agent-team-workflow
        # Board is loopback-only. If the port is busy the plugin falls back to
        # an ephemeral port and reports the actual URL.
        boardPort: 7171
        autoBoard: true
        # Subagent provider used by team_workflow_delegate.
        subagentProvider: spawn
