# dsh-agent-team-workflow bundle patch: mounts the v2 node workflow runtime.
#
# Install with `dsh plugin --profile <name> add <package-or-local-path>`.
# The plugin registers five team_workflow_* tools and one usage section.
# State is per DSH session under <dataDir>/sessions/<sessionId>; dataDir
# defaults to the platform user-data directory.
- insert:
    - id: dsh-agent-team-workflow
      name: 'dsh-agent-team-workflow'
      config:
        # Subagent provider used by agent nodes.
        subagentProvider: spawn
        # Maximum node executions per team_workflow_run / board continue call.
        maxSteps: 40
