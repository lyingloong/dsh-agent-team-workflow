# dsh-auto-workflow bundle patch: mounts the persistent node workflow runtime.
#
# Install with `dsh plugin --profile <name> add <package-or-local-path>`.
# The plugin registers seven auto_workflow_* tools, one usage section, and the
# 工作流 header button that opens the private board origin.
# State is per DSH session under <dataDir>/sessions/<sessionId>; dataDir
# defaults to the platform user-data directory.
- insert:
    - id: dsh-auto-workflow
      name: 'dsh-auto-workflow'
      config:
        # Subagent provider used by agent nodes.
        subagentProvider: spawn
        # Cooperative scheduler admissions per slice; not a task lifetime limit.
        maxSteps: 40
        # Consecutive negative outcomes allowed per packet+node before parking.
        maxFailures: 3
